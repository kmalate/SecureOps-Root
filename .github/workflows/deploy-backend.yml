
name: Deploy .NET Backend to Azure

on:
  push:
    branches:
      - master     # Triggers the build when you push to master
    paths:
      - 'SecureOps-Api/**' # Only triggers if files in the backend folder change

env:
  AZURE_WEBAPP_NAME: 'secureops-api'    # Put your Azure Web App name here
  WORKING_DIRECTORY: './SecureOps-Api'  # Path to your backend folder
  DOTNET_VERSION: '10.0.x'                   # Match your target .NET version

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - uses: actions/checkout@v4

      # 2. Set up .NET Core Environment
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3. Restore dependencies, build, and publish from the subfolder
      - name: Restore and Build
        run: dotnet build --configuration Release
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Publish App
        run: dotnet publish SecureOps.Api/SecureOps.Api.csproj -c Release -o ./publish
        working-directory: ${{ env.WORKING_DIRECTORY }}

      # 4. Deploy the published artifact to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '${{ env.WORKING_DIRECTORY }}/publish'

      # 5. Install the EF Core CLI tool on the GitHub runner
      - name: Install EF Tool
        run: dotnet tool install --global dotnet-ef

      # 6. Generate the SQL script 
      # Note: You must point to the startup project (.Api) and the project containing your DbContext (.Infrastructure)
      - name: Generate Migration Script
        run: |
          dotnet ef migrations script --idempotent --output migration.sql --project SecureOps-Api/SecureOps.Infrastructure/SecureOps.Infrastructure.csproj --startup-project SecureOps-Api/SecureOps.Api/SecureOps.Api.csproj

     # 7. Execute the script directly against Supabase using psql
      - name: Execute Migration on Supabase
        uses: docker://postgres:15
        env:
          SB_URL: ${{ secrets.SUPABASE_DB_URL }}
        with:
          args: psql -h $SB_URL -f ./migration.sql