<div class="d-flex flex-column vh-100">
  <app-header class="sticky-top" (toggleSidebar)="toggleSidebar()"></app-header>

  <div class="d-flex flex-grow-1 overflow-hidden">
    <app-sidebar 
      [class.mobile-show]="isSidebarVisible"
      class="sidebar-wrapper bg-dark border-end">
    </app-sidebar>

    @if(isSidebarVisible) {
    <div class="sidebar-overlay d-md-none" (click)="toggleSidebar()">
    </div>
    }

    <main class="flex-grow-1 overflow-auto p-4 bg-light">
      <div class="container-fluid">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>

  <app-footer></app-footer>
  <app-toast-container></app-toast-container>
</div>
